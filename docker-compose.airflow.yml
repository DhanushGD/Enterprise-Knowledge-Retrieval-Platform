# Airflow for the ETL (Step 8b). Runs NEXT TO the main stack in docker-compose.yml and talks to
# its Postgres / Qdrant / MinIO through the ports that stack publishes on the host.
#
#   docker compose up -d                                        # the main stack (Step 2)
#   docker compose -f docker-compose.airflow.yml build
#   docker compose -f docker-compose.airflow.yml up airflow-init
#   docker compose -f docker-compose.airflow.yml up -d
#   -> http://localhost:8080   (login: see README, "Airflow")
#
# Local development settings: UI bound to localhost, default auth manager, LocalExecutor
# (tasks run inside the scheduler container). Needs ~4 GB of RAM for Docker.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
  image: ekrp-airflow:3.1.8
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # These two must be identical in every Airflow container.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-ekrp-local-dev-jwt-secret-change-me-0123456789}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-ekrp-local-dev-api-secret-change-me}
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"

    # --- the ETL project, seen from inside the container ---
    EKRP_PROJECT_DIR: /opt/ekrp
    EKRP_PYTHON: /opt/airflow/ekrp-venv/bin/python
    # The main stack's services, reached through the host's published ports. These override
    # the localhost values in your .env.
    POSTGRES_HOST: host.docker.internal
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    QDRANT_URL: http://host.docker.internal:6333
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-support_kb}
    S3_ENDPOINT_URL: http://host.docker.internal:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET:-support-kb}
    S3_REGION: ${S3_REGION:-us-east-1}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    # Persistent folders (named volume): git clones and downloaded embedding models.
    CLONE_DIR: /opt/airflow/ekrp-data/sources
    MODEL_CACHE_DIR: /opt/airflow/ekrp-data/models
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro
    # Only the code and config the ETL needs (read-only): not .venv, not .env, not data/raw.
    - ./orchestration:/opt/ekrp/orchestration:ro
    - ./core:/opt/ekrp/core:ro
    - ./connectors:/opt/ekrp/connectors:ro
    - ./ingestion:/opt/ekrp/ingestion:ro
    - ./config:/opt/ekrp/config:ro
    - ./data:/opt/ekrp/data:ro                 # bundled sample docs (source.type: local)
    - airflow_logs:/opt/airflow/logs
    - ekrp_etl_data:/opt/airflow/ekrp-data
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    container_name: ekrp-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: ekrp-airflow-init
    command: ["airflow", "db", "migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: ekrp-airflow-apiserver
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: ekrp-airflow-scheduler
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: ekrp-airflow-dag-processor
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_db:
  airflow_logs:
  ekrp_etl_data:
