# Unit tests (no Docker services, no model, no corpus). MANUAL ONLY: this never runs on push or
# pull request. Start it from the repository's Actions tab ("Run workflow") when you want a
# clean-machine check. To run it automatically again, replace `workflow_dispatch:` with
#   push:
#   pull_request:
#
# The answer-quality gate (scripts/run_eval.py --gate) needs the indexed corpus and the local
# model, so it is a pre-release step you run on your machine, not a hosted-CI step.
name: tests
on:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
